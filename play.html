<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokemon Masters Dashboard</title>
<link href="style-global.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  /* --- LOCAL OVERRIDES --- */
  :root {
    --theme-green: var(--accent);
    --glass-bg: rgba(20, 20, 20, 0.85);
    --glass-border: rgba(255, 255, 255, 0.15);
    --card-dark: rgba(0, 0, 0, 0.4); 
    --text-main: #eee;
    --text-dim: #888;
    
    --p1-color: #ff4444;
    --p2-color: #4488ff;
  }

  html { 
      box-sizing: border-box; 
      font-size: 20px; 
      /* 👇 CHANGE THIS: 'auto' or 'scroll' allows scrolling */
      overflow-y: auto !important; 
      height: 100%; /* Keeps the root container full height */
  }
  *, *:before, *:after { box-sizing: inherit; }

  body { 
    font-family: 'Segoe UI', sans-serif; 
    color: var(--text-main); 
    margin: 0; 
    padding: 20px; 
    background: transparent;
    user-select: none;
    
    /* 👇 ALLOW HEIGHT TO GROW */
    height: auto !important; 
    min-height: 100vh; /* Ensures it fills at least the screen */
    width: 100%;
    
    /* Remove overflow-y: hidden from body if it was there */
  }

  /* Optional: Remove the margin from the bottom box to make it tighter */
  .glass-box:last-of-type {
      margin-bottom: 0 !important;
  }

  /* PEER HOVER STYLES */
  .peer-interactive {
      border-color: var(--peer-color) !important;
      box-shadow: 0 0 15px var(--peer-color) !important;
      z-index: 100;
      position: relative;
      transition: box-shadow 0.2s, border-color 0.2s;
  }

  .glass-box {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    position: relative;
  }

  .play-header { display: flex; gap: 15px; margin-bottom: 20px; height: 55px; }
  
  .btn-big {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    font-weight: 900;
    cursor: pointer;
    border-radius: 8px;
    font-size: 1.2rem;
    letter-spacing: 2px;
    transition: 0.2s;
    text-transform: uppercase;
  }
  
  .btn-accent {
    background: var(--theme-green) !important;
    color: #000;
    border: none;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); 
  }
  .btn-accent:hover {
    background: var(--theme-green);
    filter: brightness(1.2);
    box-shadow: 0 0 25px var(--theme-green); 
  }
  .btn-big:hover:not(.btn-accent) { color: #fff; background: rgba(255,255,255,0.1); }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

  .p-card {
  background: var(--card-dark);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  padding: 18px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  min-height: 128px; /* taller */
  display: flex;
  flex-direction: column;
  justify-content: center;
}
  
  .c-lbl { font-size: 0.75rem; color: var(--text-dim); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;}
  .c-val {
  font-size: 1.8rem;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
}
  .c-note { font-size: 0.85rem; color: var(--theme-green); font-style: italic; margin-top: 5px; }

    /* --- CASINO ROLL ANIMATION --- */
  
      /* --- CASINO ROLL / LIGHT SHOW --- */
  .card-grid {
    position: relative;
    isolation: isolate;
  }

  .p-card {
    overflow: hidden;
    position: relative;
  }

  .p-card.rolling {
    border-color: var(--theme-green);
    box-shadow:
      0 0 10px rgba(255,255,255,0.08),
      0 0 18px rgba(0,0,0,0.45),
      0 0 24px var(--theme-green);
  }

  .p-card.rolling .c-val,
  .p-card.rolling .c-note {
    animation: cardRollBlur 0.09s linear infinite;
  }

  .p-card.light-pass,
  .p-card.selected {
    border-color: var(--theme-green);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 0 18px var(--theme-green),
      0 0 36px var(--theme-green),
      0 12px 30px rgba(0,0,0,0.32);
  }

  .p-card.light-pass .c-val,
  .p-card.light-pass .c-note,
  .p-card.selected .c-val,
  .p-card.selected .c-note {
    text-shadow:
      0 0 8px var(--theme-green),
      0 0 18px rgba(255,255,255,0.10);
  }

  .p-card.light-pass::before,
  .p-card.selected::before {
    content: '';
    position: absolute;
    inset: -35%;
    background: linear-gradient(
      110deg,
      transparent 34%,
      rgba(255,255,255,0.00) 40%,
      rgba(255,255,255,0.65) 48%,
      rgba(255,255,255,0.12) 54%,
      transparent 64%
    );
    transform: translateX(-120%) rotate(10deg);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .p-card.light-pass::before {
    animation: cardLightSweep 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .p-card.selected {
    animation: selectedGlow 680ms ease-out;
  }

  .p-card.selected::before {
    animation: cardLightSweep 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .card-grid.lightshow-active::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 14px;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 25%, rgba(255,255,255,0.10), transparent 22%),
      radial-gradient(circle at 80% 72%, rgba(255,255,255,0.08), transparent 22%);
    opacity: 0;
    animation: gridAura 900ms ease-out forwards;
  }

  .celebration-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 3000;
  }

  .celebration-layer::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 22%),
      radial-gradient(circle at 80% 26%, rgba(255,255,255,0.04), transparent 24%),
      radial-gradient(circle at 30% 78%, rgba(255,255,255,0.04), transparent 22%),
      radial-gradient(circle at 74% 82%, rgba(255,255,255,0.05), transparent 26%);
  }

  .celebration-layer::after {
    content: '';
    position: absolute;
    inset: -18%;
    opacity: 0;
    pointer-events: none;
    background:
      linear-gradient(
        62deg,
        transparent 0%,
        transparent 44%,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 10%, transparent) 47%,
        rgba(255,255,255,0.18) 50%,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 10%, transparent) 53%,
        transparent 56%,
        transparent 100%
      ),
      linear-gradient(
        -62deg,
        transparent 0%,
        transparent 44%,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 10%, transparent) 47%,
        rgba(255,255,255,0.18) 50%,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 10%, transparent) 53%,
        transparent 56%,
        transparent 100%
      );
    mix-blend-mode: screen;
    filter: blur(2px) saturate(1.08);
    transform-origin: center center;
}

  .celebration-layer.active::before {
    animation: celebrationSparkle 1500ms ease-out forwards;
  }

  .confetti-piece {
    position: absolute;
    opacity: 0;
    will-change: transform, opacity;
    animation: confettiCascade var(--fall, 2200ms) cubic-bezier(0.12, 0.72, 0.22, 1) forwards;
    box-shadow: 0 0 6px rgba(255,255,255,0.18);
  }

  .confetti-piece.rect {
    width: 10px;
    height: 18px;
    border-radius: 3px;
  }

  .confetti-piece.slim {
    width: 5px;
    height: 18px;
    border-radius: 999px;
  }

  .confetti-piece.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  @keyframes celebrationSparkle {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes confettiCascade {
    0% {
      transform: translate3d(0, -8vh, 0) rotate(0deg) scale(0.75);
      opacity: 0;
    }
    8% {
      opacity: 1;
    }
    100% {
      transform: translate3d(var(--dx), 112vh, 0) rotate(var(--rot)) scale(1);
      opacity: 0;
    }
  }

  @keyframes cardRollBlur {
    0%   { transform: translateY(-6px); filter: blur(0.4px); opacity: 0.88; }
    50%  { transform: translateY(6px);  filter: blur(1.4px); opacity: 1; }
    100% { transform: translateY(-6px); filter: blur(0.4px); opacity: 0.88; }
  }

  @keyframes cardLightSweep {
    0%   { transform: translateX(-120%) rotate(10deg); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translateX(120%) rotate(10deg); opacity: 0; }
  }

  @keyframes selectedGlow {
    0% {
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 0 10px rgba(255,255,255,0.08),
        0 0 16px var(--theme-green),
        0 10px 24px rgba(0,0,0,0.26);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 0 24px var(--theme-green),
        0 0 48px var(--theme-green),
        0 14px 32px rgba(0,0,0,0.34);
    }
    100% {
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 0 16px var(--theme-green),
        0 0 32px var(--theme-green),
        0 12px 30px rgba(0,0,0,0.32);
    }
  }

  @keyframes gridAura {
    0%   { opacity: 0; filter: blur(10px); }
    30%  { opacity: 1; }
    100% { opacity: 0; filter: blur(18px); }
  }

  @keyframes confettiBurst {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg) scale(0.8);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    100% {
      transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot));
      opacity: 0;
    }
  }
  

  /* --- QUICK GEN CONTROLS --- */
  .qg-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .qg-row { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }

  
  .qg-btn {
    flex: 1;
    padding: 10px 5px;
    font-size: 0.75rem;
    font-weight: 700;
    background: #222;
    border: 1px solid #333;
    color: #ccc;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
  }
  .qg-btn:hover { border-color: var(--theme-green); color: #fff; }
  .btn-shit { border-color: #5d4037; color: #a1887f; }
  .btn-shit:hover { background: #5d4037; color: #fff; border-color: #8d6e63; }

  .x3-switch-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  margin-left: 12px;

  padding: 5px 10px;       /* ⬆ bigger padding */
  min-width: 40px;          /* ⬆ wider */
  height: 42px;             /* ⬆ taller */

  background: #111;
  border-radius: 8px;       /* slightly rounder */
  border: 2px solid #333;   /* thicker border */
  cursor: pointer;
  transition: 0.2s;
}

.x3-switch-container.active {
  border-color: var(--theme-green);
  box-shadow: 0 0 14px var(--theme-green);
}

.x3-lbl {
  font-weight: 900;
  font-size: 1.1rem;        /* ⬆ bigger text */
  color: #888;
}

#btn-qg-coin {
    perspective: 600px;
}

#btn-qg-coin .x3-lbl {
    display: inline-block;
    transform-style: preserve-3d;
}

#btn-qg-coin.coin-flipping {
    border-color: var(--theme-green);
    box-shadow:
        0 0 12px color-mix(in srgb, var(--theme-green) 30%, transparent),
        inset 0 0 8px rgba(255,255,255,0.05);
}

#btn-qg-coin.coin-flipping .x3-lbl {
    animation: coinFaceSpin 0.16s linear infinite;
}

@keyframes coinFaceSpin {
    0%   { transform: rotateY(0deg) scale(1); }
    50%  { transform: rotateY(90deg) scale(0.82); }
    100% { transform: rotateY(180deg) scale(1); }
}
  
  /* --- QUICK GEN OUTPUT BAR (AUTO HEIGHT + QUICK ROLL STATES) --- */
  .qg-unified-bar {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr) 120px;
    align-items: stretch;
    width: 100%;
    min-height: 96px;
    background: var(--card-dark);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px 14px;
    position: relative;
    margin-top: 15px;
}

  .qg-name-label {
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    cursor: pointer;
    transition: 0.2s;
}

    .qg-name-label.left-side {
    justify-content: flex-start;
    text-align: left;
}

.qg-name-label.right-side {
    justify-content: flex-end;
    text-align: right;
    padding-right: 2px;
}


  .qg-name-label:hover {
      filter: brightness(1.3);
      text-shadow: 0 0 8px currentColor;
  }

 .qg-content-area {
    min-width: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    margin: 0 8px;
}

  #qg-cont-a,
  #qg-cont-b {
      flex: 1;
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      align-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 10px;
      text-align: center;
      white-space: normal;
      word-break: break-word;
  }

  .qg-mid-divider {
      width: 2px;
      height: auto;
      min-height: 100%;
      background: #444;
      margin: 0;
      flex-shrink: 0;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }


  .qg-item.item-rolling {
    background: transparent !important;
    box-shadow: none !important;
    filter: brightness(1.08);
    text-shadow: 0 0 2px currentColor;
}

.qg-item.item-finished {
    animation: quickQGItemSnap 0.18s ease;
}

@keyframes quickQGItemSnap {
    0%   { transform: scale(0.96); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
}

  .qg-plain {
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    padding: 3px 7px;
    border-radius: 4px;
    line-height: 1.25;
}

  .qg-item {
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
    font-size: 1.2rem;
    font-weight: 700;
}

  .qg-item:hover {
      background: rgba(255,255,255,0.15);
      color: var(--theme-green);
      transform: translateY(-1px);
  }

  .qg-mini-sep {
      color: #555;
      font-size: 0.9rem;
      margin: 0 5px;
      font-weight: 300;
  }

  .qg-roll-active {
      border-color: var(--theme-green);
      box-shadow: 0 0 12px rgba(255,255,255,0.06), 0 0 22px var(--theme-green);
  }

  .qg-roll-active .qg-item,
  .qg-roll-active .qg-plain {
      animation: quickQGRoll 0.2s linear infinite;
  }

  .qg-roll-finished .qg-item,
  .qg-roll-finished .qg-plain {
      animation: quickQGRoll 0.12s ease-in-out infinite;
  }

  @keyframes quickQGRoll {
    0%   { transform: translateY(-3px); filter: blur(0.1px); opacity: 0.95; }
    50%  { transform: translateY(3px);  filter: blur(0.3px); opacity: 1; }
    100% { transform: translateY(-3px); filter: blur(0.1px); opacity: 0.95; }
}

  @keyframes quickQGSnap {
      0%   { transform: scale(0.98); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
  }

   body::before,
  body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 1200;
      transition: opacity 0.2s ease;
  }


  /* sharper neon beams / ambient streaks */
  body::before {
      background:
        linear-gradient(64deg,
          transparent 0%,
          transparent 38%,
          color-mix(in srgb, var(--winner-color, var(--theme-green)) 22%, transparent) 46%,
          color-mix(in srgb, #ffffff 16%, transparent) 49%,
          color-mix(in srgb, var(--winner-color, var(--theme-green)) 18%, transparent) 52%,
          transparent 60%,
          transparent 100%),
        linear-gradient(-64deg,
          transparent 0%,
          transparent 38%,
          color-mix(in srgb, var(--winner-color, var(--theme-green)) 18%, transparent) 46%,
          color-mix(in srgb, #ffffff 12%, transparent) 49%,
          color-mix(in srgb, var(--winner-color, var(--theme-green)) 16%, transparent) 52%,
          transparent 60%,
          transparent 100%),
        radial-gradient(circle at 16% 88%, color-mix(in srgb, var(--winner-color, var(--theme-green)) 28%, transparent), transparent 22%),
        radial-gradient(circle at 84% 88%, color-mix(in srgb, var(--winner-color, var(--theme-green)) 28%, transparent), transparent 22%);
      filter: saturate(1.18);
      transform: scale(1);
  }

  /* moving corner spotlights and neon sweeps */
  body::after {
    background:
      conic-gradient(
        from 214deg at 0% 100%,
        transparent 0deg 18deg,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 20%, transparent) 20deg,
        rgba(255,255,255,0.10) 24deg,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 18%, transparent) 28deg,
        transparent 34deg 360deg
      ),
      conic-gradient(
        from -34deg at 100% 100%,
        transparent 0deg 18deg,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 20%, transparent) 20deg,
        rgba(255,255,255,0.10) 24deg,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 18%, transparent) 28deg,
        transparent 34deg 360deg
      ),
      radial-gradient(circle at 0% 100%,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 22%, transparent),
        transparent 22%
      ),
      radial-gradient(circle at 100% 100%,
        color-mix(in srgb, var(--winner-color, var(--theme-green)) 22%, transparent),
        transparent 22%
      );
    filter: saturate(1.2);
    transform-origin: center bottom;
}

   body.winner-celebrating::before {
      opacity: 0.88;
      animation: neonSweepLayer 1800ms ease-in-out infinite alternate;
  }

  body.winner-celebrating .celebration-layer::after {
    opacity: 0.95;
    animation: crossSweep 2200ms ease-in-out infinite alternate;
}

  body.winner-celebrating::after {
    opacity: 0.98;
    animation: cornerSpotlightsSweep 2600ms ease-in-out infinite alternate;
}

  body.winner-celebrating .glass-box,
  body.winner-celebrating .g-dot,
  body.winner-celebrating .save-btn,
  body.winner-celebrating .qg-unified-bar,
  body.winner-celebrating .machine-display,
  body.winner-celebrating .token-center,
  body.winner-celebrating .p-card,
  body.winner-celebrating .rec-toggle,
  body.winner-celebrating .token-ctrls,
  body.winner-celebrating .winner-popup {
      border-color: color-mix(in srgb, var(--winner-color, var(--theme-green)) 72%, #ffffff 8%);
      box-shadow:
          0 0 0 1px rgba(255,255,255,0.04) inset,
          0 0 6px color-mix(in srgb, var(--winner-color, var(--theme-green)) 45%, transparent),
          0 0 14px color-mix(in srgb, var(--winner-color, var(--theme-green)) 22%, transparent);
  }

  @keyframes neonSweepLayer {
      0% {
          transform: translateY(0) scale(1) rotate(-1deg);
          filter: saturate(1.06) brightness(0.98);
      }
      50% {
          transform: translateY(-1.2%) scale(1.02) rotate(0deg);
          filter: saturate(1.16) brightness(1.04);
      }
      100% {
          transform: translateY(-2.2%) scale(1.035) rotate(1deg);
          filter: saturate(1.22) brightness(1.08);
      }
  }

  @keyframes cornerSpotlightsSweep {
    0% {
        transform: perspective(1400px) rotateX(0deg) rotateZ(-6deg) scale(1);
        filter: brightness(0.95) saturate(1.05);
    }
    20% {
        transform: perspective(1400px) rotateX(1deg) rotateZ(-2deg) scale(1.02);
        filter: brightness(1.02) saturate(1.08);
    }
    40% {
        transform: perspective(1400px) rotateX(-1deg) rotateZ(3deg) scale(1.03);
        filter: brightness(1.10) saturate(1.14);
    }
    60% {
        transform: perspective(1400px) rotateX(1deg) rotateZ(-1deg) scale(1.04);
        filter: brightness(1.16) saturate(1.18);
    }
    80% {
        transform: perspective(1400px) rotateX(-1deg) rotateZ(5deg) scale(1.03);
        filter: brightness(1.10) saturate(1.12);
    }
    100% {
        transform: perspective(1400px) rotateX(0deg) rotateZ(-4deg) scale(1.02);
        filter: brightness(1.04) saturate(1.08);
    }
}


  @keyframes crossSweep {
    0% {
        transform: rotate(-7deg) scale(1.02) translateX(-2%);
        filter: blur(2px) brightness(0.9) saturate(1.02);
    }
    25% {
        transform: rotate(-2deg) scale(1.04) translateX(1%);
        filter: blur(2px) brightness(1) saturate(1.08);
    }
    50% {
        transform: rotate(4deg) scale(1.06) translateX(0%);
        filter: blur(2px) brightness(1.1) saturate(1.12);
    }

let sfxCtx = null;

const SFX_MASTER = 1.4;

function getSfxCtx() {

function unlockSfx() {

document.addEventListener('pointerdown', unlockSfx, { passive: true });
document.addEventListener('keydown', unlockSfx);

function createNoiseBuffer(duration = 0.15) {
    const ctx = getSfxCtx();
    const buffer = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * duration)), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    }
    return buffer;
}

function playTone({ freq = 440, type = 'sine', when = 0, dur = 0.08, gain = 0.04, slideTo = null }) {
    const ctx = getSfxCtx();
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, when);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, when + dur);

    const outGain = Math.max(0.0001, gain * SFX_MASTER);

amp.gain.setValueAtTime(0.0001, when);
amp.gain.exponentialRampToValueAtTime(outGain, when + 0.01);
amp.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    osc.connect(amp);
    amp.connect(ctx.destination);

    osc.start(when);
    osc.stop(when + dur + 0.02);
}

function playNoiseBurst({ when = 0, dur = 0.08, gain = 0.015, highpass = 900 }) {
    const ctx = getSfxCtx();
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const amp = ctx.createGain();

    src.buffer = createNoiseBuffer(dur);
    filter.type = 'highpass';
    filter.frequency.value = highpass;

    const outGain = Math.max(0.0001, gain * SFX_MASTER);

amp.gain.setValueAtTime(outGain, when);
amp.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    src.connect(filter);
    filter.connect(amp);
    amp.connect(ctx.destination);

    src.start(when);
    src.stop(when + dur + 0.01);
}



function playCoinPing(when, pitch = 1500) {

    });

    playTone({

        when: when + 0.004,
        dur: 0.034,
        gain: 0.010,
        slideTo: pitch * 1.55
    });

    playNoiseBurst({

        dur: 0.010,
        gain: 0.002,
        highpass: 2200
    });

    });

function playCoinFlipFx({ delayMs = 0, durationMs = COIN_SIDE_DURATION } = {}) {
    const ctx = getSfxCtx();
    const startAt = ctx.currentTime + (delayMs / 1000);
    const totalSec = Math.max(0.18, durationMs / 1000);

    const tickCount = Math.max(6, Math.round(durationMs / 90));

    for (let i = 0; i < tickCount; i++) {
        const p = tickCount === 1 ? 1 : (i / (tickCount - 1));

function playRollTick(when, flavor = 'play') {
    const bright = flavor === 'quickgen' ? 1550 : 1320;
    const base = flavor === 'quickgen' ? 880 : 760;

    playNoiseBurst({
        when,
        dur: 0.016,

    });

    playTone({

        when: when + 0.008,
        dur: 0.016,
        gain: 0.007
    });
}

function playRollDecisionChime(when, flavor = 'play') {
    const root = flavor === 'quickgen' ? 783.99 : 659.25;

    playTone({

        when,
        dur: 0.07,

    });

    });

    });

    });
}

function playDiceRollFx({ delayMs = 0, durationMs = 1000, flavor = 'play' } = {}) {
    const ctx = getSfxCtx();
    const startAt = ctx.currentTime + (delayMs / 1000);
    const totalSec = Math.max(0.14, durationMs / 1000);

    /* lots of quick ticks early, slower ticks near the end */
    const tickCount = Math.max(8, Math.round(durationMs / 60));

    for (let i = 0; i < tickCount; i++) {
        const p = tickCount === 1 ? 1 : (i / (tickCount - 1));

        /* dense at start, more spaced at end */
        const t = totalSec * 0.84 * Math.pow(p, 1.75);
        playRollTick(startAt + t, flavor);
    }

    playRollDecisionChime(startAt + totalSec, flavor);
}

const COIN_SIDE_DURATION = 680;
const COIN_ITEM_DURATION = 520;

function animateQuickGenItem(side, idx, finalText, type) {
    const container = document.getElementById('qg-cont-' + side);
    if (!container) return Promise.resolve();

    const item = container.querySelector(`.qg-item[data-side="${side}"][data-idx="${idx}"]`);
    if (!item) return Promise.resolve();

    const pool = getQuickGenPool(type, side);
    const duration = type === 'Coin Flip' ? COIN_ITEM_DURATION : 240;

    if (!pool.length || !finalText || finalText === '-') {
        item.textContent = finalText || '-';
        return Promise.resolve();
    }

    item.classList.remove('item-finished');
    item.classList.add('item-rolling');

    return new Promise(resolve => {
        const start = performance.now();
        let nextSwapAt = 0;

        function tick(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            const interval = 20 + Math.pow(progress, 2) * 30;

            if (elapsed >= nextSwapAt) {
                item.textContent = pool[Math.floor(Math.random() * pool.length)];
                nextSwapAt += interval;
            }

            if (elapsed < duration) {
                requestAnimationFrame(tick);
            } else {
                item.textContent = finalText;
                item.classList.remove('item-rolling');
                item.classList.add('item-finished');

                setTimeout(() => {
                    item.classList.remove('item-finished');
                }, 180);

                resolve();
            }
        }

        requestAnimationFrame(tick);
    });
}

    function animateQuickGenSide(side, finalText, type) {

        window.qgAnimTokens[side] = (window.qgAnimTokens[side] || 0) + 1;
        const token = window.qgAnimTokens[side];

        const pool = getQuickGenPool(type, side);
        const finalParts = String(finalText || '-').split(' / ');
        const duration = type === 'Coin Flip' ? COIN_SIDE_DURATION : 380;

        if (!pool.length || !type || finalText === '-') {
            renderQGBlockStatic(side, finalText, type);
            return Promise.resolve();
        }

        if (bar) {
            bar.classList.remove('qg-roll-finished');
            bar.classList.add('qg-roll-active');
        }

        return new Promise(resolve => {
            const start = performance.now();
            let nextSwapAt = 0;

            function tick(now) {
                if (window.qgAnimTokens[side] !== token) {
                    resolve();
                    return;
                }

                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                const interval = 18 + Math.pow(progress, 2.2) * 48;

                if (elapsed >= nextSwapAt) {
                    const temp = finalParts.map(() => pool[Math.floor(Math.random() * pool.length)]);
                    renderQGBlockStatic(side, temp.join(' / '), type);
                    nextSwapAt += interval;
                }

                if (elapsed < duration) {
                    requestAnimationFrame(tick);
                } else {
                    if (window.qgAnimTokens[side] === token) {
                        renderQGBlockStatic(side, finalText, type);

                        if (bar) {
                            bar.classList.remove('qg-roll-active');

    // --- HELPER: NORMALIZE DATA TO ARRAY ---
    function getList(key) {
    const lib = window.appData || {};

    const aliases = {
        gameModes: ['gameModes', 'Game Modes'],
        sides: ['sides', 'Side Options'],
        points: ['points', 'Points List'],
        sp: ['sp', 'SP List'],

        'Game Modes': ['Game Modes', 'gameModes'],
        'Side Options': ['Side Options', 'sides'],
        'Points List': ['Points List', 'points'],
        'SP List': ['SP List', 'sp']
    };

    const keysToTry = aliases[key] || [key];

    for (const k of keysToTry) {
        const raw = lib[k];
        if (raw) {
            return Array.isArray(raw) ? raw : Object.values(raw);
        }
    }

    return [];
}

    function normalizeEntry(item) {
    return {
        text: (typeof item === 'object' && item && item.text) ? item.text : (item || ''),
        note: (typeof item === 'object' && item && item.note) ? item.note : ''
    };
}

function normalizeFixedState(data) {
    const src = data || {};
    return {
        mode: {
            value: typeof src.mode?.value === 'string' ? src.mode.value : '',
            locked: !!src.mode?.locked
        },
        side: {
            value: typeof src.side?.value === 'string' ? src.side.value : '',
            locked: !!src.side?.locked
        },
        points: {
            value: typeof src.points?.value === 'string' ? src.points.value : '',
            locked: !!src.points?.locked
        },
        sp: {
            value: typeof src.sp?.value === 'string' ? src.sp.value : '',
            locked: !!src.sp?.locked
        }
    };
}

function getFixedRollResult(key, listKey) {
    const fixed = normalizeFixedState((window.appData || {}).fixed);
    const rule = fixed[key];

    if (!rule || !rule.locked || !rule.value) return null;

    const match = getList(listKey)
        .map(normalizeEntry)
        .find(item => item.text === rule.value);

    return match || { text: rule.value, note: '' };
}

function getRandomRollResult(listKey) {
    const list = getList(listKey)
        .map(normalizeEntry)
        .filter(item => item.text);

    if (!list.length) return null;
    return list[Math.floor(Math.random() * list.length)];
}

function getFinalRollResult(key, listKey) {
    return getFixedRollResult(key, listKey) || getRandomRollResult(listKey) || { text: '', note: '' };

function animateRollCard(key, listKey, finalPick, duration = 2200, delay = 0) {
    const list = getList(listKey).map(normalizeEntry);
    const reel = list.length ? list : [normalizeEntry(finalPick)];
    const card = document.getElementById('card-' + key);

    return new Promise(resolve => {
        setTimeout(() => {
            if (card) {
                card.classList.remove('selected');
                card.classList.add('rolling');
            }

            const start = performance.now();
            let nextSwapAt = 0;
            let index = Math.floor(Math.random() * reel.length);
            const target = normalizeEntry(finalPick);

            function tick(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);

                /* fast start, smooth slow-down near the end */
                const interval = 45 + Math.pow(progress, 3) * 320;

                if (elapsed >= nextSwapAt) {
                    const temp = reel[index % reel.length];
                    setCardDisplay(key, temp.text, temp.note);
                    index++;
                    nextSwapAt += interval;
                }

                if (elapsed < duration) {
                    requestAnimationFrame(tick);
                } else {
                    setCardDisplay(key, target.text, target.note);

                    if (card) {
                        card.classList.remove('rolling');
                        flashSelectedCard(card);
                    }

                    resolve(target);
                }
            }

            requestAnimationFrame(tick);
        }, delay);
    });
}

window.rollClientId = window.rollClientId || ('client-' + Math.random().toString(36).slice(2) + Date.now());
window.lastRollCommandId = null;
window.rollListenerReady = false;
window.activeRollingCards = window.activeRollingCards || new Set();

function isCardRolling(key) {
    return window.activeRollingCards.has(key);
}

function setCardRollingState(key, rolling) {
    if (rolling) window.activeRollingCards.add(key);
    else window.activeRollingCards.delete(key);
}

function buildRollCommand(defs) {
    const cards = defs.map(def => {
        const result = getFinalRollResult(def.key, def.listKey);
        if (!result || !result.text) return null;

        return {
            key: def.key,
            listKey: def.listKey,
            noteKey: def.noteKey,
            duration: def.duration,
            delay: def.delay || 0,
            result: normalizeEntry(result)
        };
    }).filter(Boolean);

    if (!cards.length) return null;

    return {
        id: 'roll-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        sourceId: window.rollClientId,
        createdAt: Date.now(),
        startAt: Date.now() + 120,
        cards
    };
}

function playRollCommand(command) {
    if (!command || !Array.isArray(command.cards) || !command.cards.length) {
        return Promise.resolve();
    }

    const cardsToPlay = command.cards.filter(cardCfg => !isCardRolling(cardCfg.key));
    
    if (!cardsToPlay.length) return Promise.resolve();

    const sharedDelay = Math.max(0, (command.startAt || Date.now()) - Date.now());

    const rollDurationMs = Math.max(
    ...cardsToPlay.map(cardCfg => (cardCfg.delay || 0) + (cardCfg.duration || 0))
);

playDiceRollFx({
    delayMs: sharedDelay,
    durationMs: rollDurationMs,
    flavor: 'play'
});

    return Promise.all(
    cardsToPlay.map(cardCfg => {
        setCardRollingState(cardCfg.key, true);

        const cardEl = document.getElementById('card-' + cardCfg.key);
        if (cardEl) {
            cardEl.classList.remove('selected');
            cardEl.classList.remove('rolling');
        }

        return animateRollCard(
            cardCfg.key,
            cardCfg.listKey,
            cardCfg.result,
            cardCfg.duration,
            sharedDelay + (cardCfg.delay || 0)
        ).then(finalCard => {
            setCardRollingState(cardCfg.key, false);

            if (command.sourceId === window.rollClientId) {
                const updates = {};
                updates['dashboard/' + cardCfg.key] = finalCard.text || '-';

                if (cardCfg.noteKey) {
                    updates['dashboard/' + cardCfg.noteKey] = finalCard.note || '';
                }

                return db.ref().update(updates);
            }
        }).catch(err => {
            setCardRollingState(cardCfg.key, false);
            throw err;
        });
    })
);
}

function requestRoll(defs) {
    if (!Array.isArray(defs) || !defs.length) return;

    const availableDefs = defs.filter(def => !isCardRolling(def.key));
    if (!availableDefs.length) return;

    const command = buildRollCommand(availableDefs);
    if (!command) return;

    window.lastRollCommandId = command.id;
    playRollCommand(command);
    db.ref('dashboardRoll').set(command);
}

db.ref('dashboardRoll').on('value', snap => {
    const command = snap.val();

    /* ignore the old roll already sitting in Firebase when the page first loads */
    if (!window.rollListenerReady) {
        window.rollListenerReady = true;
        if (command && command.id) window.lastRollCommandId = command.id;
        return;
    }

    if (!command || !command.id || command.id === window.lastRollCommandId) return;

    window.lastRollCommandId = command.id;
    playRollCommand(command);
});

    function generateSet(type, count, excludeItems = []) {
        if(type === 'Coin Flip') {
            let result = [];
            for(let i=0; i<count; i++) {
                result.push(Math.random() < 0.5 ? 'Heads' : 'Tails');
            }
            return result.join(' / ');
        }

        let pool = [];
        if(type === 'Type') pool = [...TYPES];
        else if(type === 'Colour') pool = [...COLORS];
        else if(type === 'RNG (1-9)') pool = [1,2,3,4,5,6,7,8,9];
        else if(type === 'Legendary Trio') {
            const trios = getList('trios');
            pool = trios.map(t => t.text);
        }
        else return ["-"];

        pool = pool.filter(item => !excludeItems.includes(item));
        let result = [];
        for(let i=0; i<count; i++) {
            if(pool.length === 0) break;
            let idx = Math.floor(Math.random() * pool.length);
            result.push(pool[idx]);
            pool.splice(idx, 1);
        }
        return result.join(" / ");
    }

            let dbVal = window.recState?.dots?.[i] || '';
            let resName = (dbVal === 'A') ? window.p1Name : (dbVal === 'B' ? window.p2Name : '-');
            let lVal = document.getElementById('lnk-'+i).value || '';

            let gameInfo = { result: resName };

            if(settings.mode === 'Challenge') {
                gameInfo.mode = document.getElementById('sel-m-'+i).value;
                gameInfo.side = document.getElementById('sel-s-'+i).value;
                gameInfo.sp = "4";
                gameInfo.points = payload.points;
            }

            payload.record.push(gameInfo);

            if(lVal) payload.links.push(`G${i+1}: ${lVal}`);
        }
        playSaveCelebration();

        await db.ref('history').push(payload);

        const winnerColor = getWinnerColor(winner);
        runPlayWinnerCelebration(winnerColor);
        showWinnerPopup(winner, winnerColor);
        launchConfetti(document.getElementById('win-res'));

        setTimeout(() => {
            db.ref('record').update({ dots:null, links:null, details:null });
        }, 2600);
    } catch (err) {
        console.error(err);
        alert("Save failed.");
    } finally {
        setTimeout(() => {
            if (saveBtn) {
                saveBtn.dataset.busy = '0';
                saveBtn.disabled = false;
                saveBtn.innerText = 'SAVE';
            }
        }, 900);
    }
};

document.addEventListener('DOMContentLoaded', () => {
    const contA = document.getElementById('qg-cont-a');
    const contB = document.getElementById('qg-cont-b');

    if (contA) contA.addEventListener('click', handleQuickGenItemClick);
    if (contB) contB.addEventListener('click', handleQuickGenItemClick);
});




  </script>
</body>
